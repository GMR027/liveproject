replicaCount: 2

image:
  repository: gmr27/liveproject-site
  tag: latest          # deploy.sh lo sustituye por una etiqueta única en cada despliegue
  pullPolicy: IfNotPresent
imagePullSecrets: []

service:
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: liveproject.iguzman.com.mx
  clusterIssuer: letsencrypt-prod
  tlsSecret: liveproject-cert

resources:
  requests: { cpu: 25m, memory: 32Mi }
  limits: { cpu: 200m, memory: 128Mi }
