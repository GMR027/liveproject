apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "liveproject-site.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "liveproject-site.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
